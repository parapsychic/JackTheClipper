# Builds the Windows installer and a portable exe.
# Push a tag like v1.2.0 to publish them as a GitHub Release; run it by hand to just get the files as artifacts.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # create the release

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Version from tag
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.0-dev' }
          "VERSION=$v" >> $env:GITHUB_ENV

      # Self-contained single file: people don't need .NET installed.
      - name: Publish
        run: >
          dotnet publish JackTheClipper.csproj -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:Version=${{ env.VERSION }} -o out

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:VERSION" installer\JackTheClipper.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item out\JackTheClipper.exe "installer\Output\JackTheClipper-$env:VERSION-portable.exe"

      - uses: actions/upload-artifact@v5
        with:
          name: JackTheClipper-${{ env.VERSION }}-windows
          path: installer/Output/*.exe

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} (Get-ChildItem installer/Output/*.exe) --title "Jack the Clipper ${{ env.VERSION }}" --generate-notes
        shell: pwsh
